[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autotest-ghost"
version = "0.1.0"
description = "Watches your Python files, writes tests with an LLM, runs them, and heals them when they break."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mubashir Rafiq" }]
keywords = ["testing", "pytest", "llm", "ai", "test-generation", "self-healing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

# Runtime dependencies. Each is annotated with the stage that first uses it, so
# the dependency list doubles as a map of what gets built when.
dependencies = [
  "click>=8.1.7",          # stage 0  - CLI framework
  "pydantic>=2.9",         # stage 1  - validation
  "pydantic-settings>=2.6", # stage 1 - layered config; also supplies TOML + .env sources
  "httpx>=0.27",           # stage 2  - the ONE http stack (IMPROVEMENTS 2.4)
  "groq>=0.11",            # stage 2  - AsyncGroq
  "rich>=13.9",            # stage 12 - presentation (console.py only)
  "watchdog>=6.0",         # stage 9  - filesystem events
  "pytest>=8.3",           # stage 5  - Ghost shells out to pytest; needed when the
                           #            target project has no venv of its own
]

# Extra providers are opt-in. A missing extra must produce a named, actionable
# error -- never a bare ImportError traceback.
[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
all = ["autotest-ghost[openai,anthropic]"]

[project.scripts]
ghost = "ghost.cli:main"

[project.urls]
Homepage = "https://github.com/Mubashir-Rafiq/autotest-ghost"
Documentation = "https://github.com/Mubashir-Rafiq/autotest-ghost#readme"
Repository = "https://github.com/Mubashir-Rafiq/autotest-ghost.git"
Issues = "https://github.com/Mubashir-Rafiq/autotest-ghost/issues"
Changelog = "https://github.com/Mubashir-Rafiq/autotest-ghost/blob/main/ROADMAP.md"

[dependency-groups]
dev = [
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "pytest-cov>=5",
  "respx>=0.21",           # mocks at the httpx transport layer, so the real SDK is tested
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pre-commit>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ghost"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/ROADMAP.md"]

# ---------------------------------------------------------------------------
# ruff -- replaces black + isort + flake8. One tool, one config.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"   # makes accidental 3.12+ syntax a lint error, not a CI surprise
src = ["src", "tests"]
# Recent ruff formats Python code blocks inside Markdown. Our .md files are
# specifications, and SPEC.md 7.1 pins the EXACT text a generated test must
# contain -- reformatting a spec silently changes what the code must do.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "F", "E", "W",      # pyflakes + pycodestyle
  "I",                # import sorting (replaces isort)
  "N",                # pep8-naming
  "UP",               # pyupgrade
  "B",                # bugbear
  "A",                # builtin shadowing
  "C4",               # comprehensions
  "C90",              # mccabe complexity
  "DTZ",              # naive datetimes -- keeps generated headers deterministic
  "T20",              # bans print() -- SKILL rule 9, mechanically enforced
  "SIM", "RET", "PIE", "ISC",
  "TID",              # tidy imports (no relative imports)
  "PTH",              # pathlib over os.path
  "ARG",              # unused arguments
  "PL",               # pylint subset
  "RUF",
  "ASYNC",            # blocking calls inside async def -- the key ruleset for this port
  "S",                # bandit
  "ANN",              # missing annotations
  "EM",               # exception messages assigned to a name first
  "TRY",              # exception antipatterns
  "LOG", "G",         # logging correctness
  "FBT",              # boolean-trap arguments
  "SLF",              # private member access
  "PT",               # pytest style
  "ERA",              # commented-out code
]
ignore = [
  "ANN401",   # Any is sometimes genuinely correct
  "PLR0913",  # we pass many keyword-only args deliberately
  "TRY003",   # our errors MUST name the offending input, so messages are long
  "ISC001",   # conflicts with the formatter
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Each banned import below is a rule from the plan, enforced mechanically
# rather than remembered.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Use httpx -- one HTTP stack (IMPROVEMENTS 2.4)."
"subprocess.run".msg = "Use asyncio.create_subprocess_exec in runner.py."
"asyncio.get_event_loop".msg = "Use asyncio.get_running_loop()."

[tool.ruff.lint.mccabe]
max-complexity = 10   # the pipeline state machine is the function at risk here

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",     # assert is the point
  "PLR2004",  # magic numbers in assertions are fine
  "ANN201",   # test functions return None
  "SLF001",   # tests may reach into private members
  "ARG001", "ARG002",
]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy -- strict. The original's was strict = false, i.e. decorative.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/ghost", "tests"]
enable_error_code = [
  "unused-awaitable",   # a coroutine created and never awaited fails SILENTLY at
                        # runtime; this turns it into a build error
  "redundant-expr",
  "possibly-undefined",
  "truthy-bool",
  "truthy-iterable",
  "ignore-without-code",
  "explicit-override",
  "mutable-override",
]

[[tool.mypy.overrides]]
module = ["watchdog.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
xfail_strict = true
# Turns "coroutine was never awaited" and httpx "Unclosed client" warnings into
# test failures -- finds forgotten awaits and leaked clients for free.
filterwarnings = ["error"]
markers = [
  "slow: takes more than a second (real subprocesses, real observers)",
  "network: hits a real provider API (deselected by default)",
]

[tool.coverage.run]
source = ["src/ghost"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# Runs the fast gates before every commit, so CI round-trips are for real
# failures rather than formatting. Install once with: uv run pre-commit install
#
# mypy and import-linter are deliberately NOT here: both need the full resolved
# environment and are slow enough to make committing annoying. CI runs them, and
# `make check` runs them locally on demand.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
